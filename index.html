<!DOCTYPE html> 

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Your Seat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #555;
    }
    input {
      padding: 14px;
      width: 100%;
      max-width: 400px;
      font-size: 18px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .result {
      font-size: 22px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>Find Your Seat</h1>
  <p>Type your name below</p>

  <input
    type="text"
    id="searchInput"
    placeholder="e.g. Maria"
    autocomplete="off"
  >

  <div class="result" id="result"></div>

<script>
  const sheetID = "1tnahNX2ORG61zDElp32dwQsnI6QouwKTh5yDAy9NuqA";
  const sheetURL = `https://docs.google.com/spreadsheets/d/1tnahNX2ORG61zDElp32dwQsnI6QouwKTh5yDAy9NuqA/edit?gid=0#gid=0`;

  fetch(sheetURL)
    .then(response => response.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0, -2));

      const rows = json.table.rows.map(row => ({
        name: row.c[0]?.v?.toLowerCase().trim(),
        table: row.c[1]?.v
      }));

      const input = document.getElementById("searchInput");
      const result = document.getElementById("result");

      input.addEventListener("input", () => {
        const value = input.value.toLowerCase().trim();

        if (value.length === 0) {
          result.innerHTML = "";
          return;
        }

        const match = rows.find(r => r.name.startsWith(value));

        if (match) {
          result.innerHTML = `✨ You are seated at <strong>Table ${match.table}</strong>`;
        } else {
          result.innerHTML = "No match yet — please check spelling";
        }
      });
    })
    .catch(error => {
  document.getElementById("result").innerHTML =
    "Error loading guest list: " + error;
});

</script>

</body>
</html>
